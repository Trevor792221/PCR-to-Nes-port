# Pixel Racer NES memory map -- MMC1 (SNROM): 128 KB PRG-ROM (8 x 16 KB),
# 8 KB CHR-RAM, 8 KB battery-backed PRG-RAM.  Banks 0-6 switch in at $8000,
# bank 7 is fixed at $C000.  Every bank ends in the same 32-byte reset stub.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    OAMRAM: start = $0200, size = $0100, type = rw, file = "";
    RAM:    start = $0300, size = $0500, type = rw, file = "";
    HDR:    start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG0:   start = $8000, size = $3FE0, type = ro, file = %O, fill = yes, fillval = $FF;
    STB0:   start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG1:   start = $8000, size = $3FE0, type = ro, file = %O, fill = yes, fillval = $FF;
    STB1:   start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG2:   start = $8000, size = $3FE0, type = ro, file = %O, fill = yes, fillval = $FF;
    STB2:   start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG3:   start = $8000, size = $3FE0, type = ro, file = %O, fill = yes, fillval = $FF;
    STB3:   start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG4:   start = $8000, size = $3FE0, type = ro, file = %O, fill = yes, fillval = $FF;
    STB4:   start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG5:   start = $8000, size = $3FE0, type = ro, file = %O, fill = yes, fillval = $FF;
    STB5:   start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG6:   start = $8000, size = $3FE0, type = ro, file = %O, fill = yes, fillval = $FF;
    STB6:   start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG7:   start = $C000, size = $3FC0, type = ro, file = %O, fill = yes, fillval = $FF;
    CHT7:   start = $FFC0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
    STB7:   start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    OAM:      load = OAMRAM, type = bss;
    BSS:      load = RAM,    type = bss, define = yes;
    HEADER:   load = HDR,    type = ro;
    BANK0:    load = PRG0,   type = ro, align = $10;
    BANK1:    load = PRG1,   type = ro;
    BANK2:    load = PRG2,   type = ro;
    BANK3:    load = PRG3,   type = ro;
    FIXED:    load = PRG7,   type = ro, align = $100;
    STUB0:    load = STB0,   type = ro;
    STUB1:    load = STB1,   type = ro;
    STUB2:    load = STB2,   type = ro;
    STUB3:    load = STB3,   type = ro;
    STUB4:    load = STB4,   type = ro;
    STUB5:    load = STB5,   type = ro;
    STUB6:    load = STB6,   type = ro;
    STUB7:    load = STB7,   type = ro;
    CHEATS:   load = CHT7,   type = ro;
}
